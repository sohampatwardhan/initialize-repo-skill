name: ci

# Heavy jobs (shellcheck, actionlint, tests) run only when a change touches
# logic. The single required check, ci-ok, always reports so docs-only PRs are
# never stuck pending.
# Do not add on.paths / on.paths-ignore: a skipped workflow leaves required checks pending.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      logic: ${{ steps.scope.outputs.logic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Scope classifier tests
        run: bash scripts/ci-scope.test.sh
      - id: scope
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # HEAD is GitHub's merge commit; HEAD^1 is the base branch tip.
            # --no-renames lists both paths of a move, so moving logic into
            # docs/ is still classified by where it came from.
            kind=$(git diff --name-only --no-renames HEAD^1 HEAD | bash scripts/ci-scope.sh)
          else
            kind=logic
          fi
          # Fail closed: skip heavy jobs only on exactly "non-logic". Any other
          # output (empty, a typo, a future value) runs them.
          if [ "$kind" = "non-logic" ]; then
            echo "logic=false" >> "$GITHUB_OUTPUT"
          else
            echo "logic=true" >> "$GITHUB_OUTPUT"
          fi

  shellcheck:
    needs: scope
    if: needs.scope.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' 'tests/fake-gh/gh')
          # shellcheck disable=SC2086
          [ -z "$files" ] || shellcheck $files

  actionlint:
    needs: scope
    if: needs.scope.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          dest="$RUNNER_TEMP/actionlint"
          mkdir -p "$dest"
          curl -fsSL -o "$dest/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ver}/${tarball}"
          (cd "$dest" && echo "${sha}  ${tarball}" | sha256sum -c -)
          tar -xzf "$dest/$tarball" -C "$dest" actionlint
          echo "$dest" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint .github/workflows/*.yml

  tests:
    needs: scope
    if: needs.scope.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure jq
        run: command -v jq >/dev/null || sudo apt-get install -y jq
      - name: Ensure yq
        run: command -v yq >/dev/null || { echo "yq is required but not found on this runner" >&2; exit 1; }
      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          dest="$RUNNER_TEMP/actionlint"
          mkdir -p "$dest"
          curl -fsSL -o "$dest/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ver}/${tarball}"
          (cd "$dest" && echo "${sha}  ${tarball}" | sha256sum -c -)
          tar -xzf "$dest/$tarball" -C "$dest" actionlint
          echo "$dest" >> "$GITHUB_PATH"
      - name: Run tests
        run: bash tests/run-all.sh

  ci-ok:
    needs: [scope, shellcheck, actionlint, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs to pass (skipped counts as success)
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "A required job failed or was cancelled" >&2
            exit 1
          fi
